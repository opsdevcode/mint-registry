name: Attach registry snapshot

# A merged Release Please PR creates the tag and GitHub prerelease. This
# workflow attaches the immutable JSON snapshot and SHA256SUMS. It never
# calculates a version, pushes a tag, or marks the release latest.

on:
  release:
    types:
      - published

permissions: {}

concurrency:
  group: attach-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  attach:
    if: github.event.release.prerelease == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate tag and static records
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "${TAG}" =~ ^v0\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]; then
            echo "refuse non-alpha or 1.x release tag ${TAG}"
            exit 1
          fi
          python3 scripts/validate.py
          VERSION="$(sed 's/[[:space:]]*#.*//' VERSION | tr -d '[:space:]')"
          if [[ "${TAG}" != "v${VERSION}" ]]; then
            echo "release tag ${TAG} must match VERSION ${VERSION}"
            exit 1
          fi

      - name: Digest snapshot files
        run: |
          set -euo pipefail
          sha256sum records/v0.json index.json VERSION > SHA256SUMS
          cat SHA256SUMS

      - name: Upload snapshot assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "${TAG}" records/v0.json index.json SHA256SUMS --clobber
